# Dispatch — Default Snippets
# These are foundational utility snippets that ship with Dispatch.
# Feel free to edit, disable, or remove any of them.

name = "Defaults"

# ── Date & Time ───────────────────────────────────────

[[snippets]]
trigger = ":date"
label = "Today's date"
body = "{{date}}"
tags = ["utility", "date"]

  [[snippets.variables]]
  name = "date"
  type = "date"

    [snippets.variables.params]
    format = "%Y-%m-%d"

[[snippets]]
trigger = ":time"
label = "Current time"
body = "{{time}}"
tags = ["utility", "date"]

  [[snippets.variables]]
  name = "time"
  type = "date"

    [snippets.variables.params]
    format = "%H:%M"

[[snippets]]
trigger = ":now"
label = "Date and time"
body = "{{now}}"
tags = ["utility", "date"]

  [[snippets.variables]]
  name = "now"
  type = "date"

    [snippets.variables.params]
    format = "%Y-%m-%d %H:%M"

[[snippets]]
trigger = ":iso"
label = "ISO 8601 timestamp"
body = "{{iso}}"
tags = ["utility", "date"]

  [[snippets.variables]]
  name = "iso"
  type = "date"

    [snippets.variables.params]
    format = "%Y-%m-%dT%H:%M:%S%z"

# ── Clipboard ─────────────────────────────────────────

[[snippets]]
trigger = ":clip"
label = "Clipboard contents"
body = "{{clip}}"
tags = ["utility"]

  [[snippets.variables]]
  name = "clip"
  type = "clipboard"

# ── Kaomoji & Symbols ─────────────────────────────────

[[snippets]]
trigger = ":shrug"
label = "Shrug"
body = "¯\\_(ツ)_/¯"
tags = ["kaomoji"]

[[snippets]]
trigger = ":tableflip"
label = "Table flip"
body = "(╯°□°)╯︵ ┻━┻"
tags = ["kaomoji"]

[[snippets]]
trigger = ":unflip"
label = "Table unflip"
body = "┬─┬ノ( º _ ºノ)"
tags = ["kaomoji"]

[[snippets]]
trigger = ":lenny"
label = "Lenny face"
body = "( ͡° ͜ʖ ͡°)"
tags = ["kaomoji"]

[[snippets]]
trigger = ":disapprove"
label = "Look of disapproval"
body = "ಠ_ಠ"
tags = ["kaomoji"]

# ── Markdown helpers ──────────────────────────────────

[[snippets]]
trigger = ":mdlink"
label = "Markdown link from clipboard"
body = "[{{label}}]({{url}})"
tags = ["markdown", "utility"]

  [[snippets.variables]]
  name = "url"
  type = "clipboard"

  [[snippets.variables]]
  name = "label"
  type = "form"

    [snippets.variables.params]
    label = "Link text"
    default = "link"

[[snippets]]
trigger = ":mdimg"
label = "Markdown image from clipboard"
body = "![{{alt}}]({{url}})"
tags = ["markdown", "utility"]

  [[snippets.variables]]
  name = "url"
  type = "clipboard"

  [[snippets.variables]]
  name = "alt"
  type = "form"

    [snippets.variables.params]
    label = "Alt text"
    default = "image"
